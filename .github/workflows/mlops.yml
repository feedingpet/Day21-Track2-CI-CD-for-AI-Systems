name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chay unit tests tren du lieu ao (khong can GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # 2.11.1: Chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v

  # JOB 2: Huan luyen mo hinh tren du lieu thuc, upload artifact len cloud storage
  train:
    name: Train
    needs: test              # Chi chay khi job test qua
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # 2.11.2: Ghi noi dung secret CLOUD_CREDENTIALS ra file tam va set bien moi truong
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        # 2.11.3: Dung lenh dvc pull de tai data
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        # 2.11.4: Doc gia tri "accuracy" tu file outputs/metrics.json va set thanh output
        run: |
          acc=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$acc" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # 2.11.5: Su dung google-cloud-storage SDK de upload file model.pkl
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage
          
          bucket_name = '${{ secrets.CLOUD_BUCKET }}'
          model_path = 'models/model.pkl'
          destination_blob_name = 'models/latest/model.pkl'
          
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob(destination_blob_name)
          
          blob.upload_from_filename(model_path)
          print(f"Uploaded {model_path} to gs://{bucket_name}/{destination_blob_name}")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  # JOB 3: Kiem tra chat luong - chi cho phep deploy khi accuracy >= 0.70
  eval:
    name: Eval
    needs: train             # Chi chay khi job train qua
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # 2.11.6: Doc gia tri accuracy tu output cua job train va kiem tra
        run: |
          python - <<'EOF'
          import sys
          acc = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.70
          if acc < threshold:
              print(f"❌ Accuracy {acc:.4f} is below threshold {threshold}. Aborting deploy.")
              sys.exit(1)
          else:
              print(f"✅ Accuracy {acc:.4f} meets the threshold {threshold}. Proceeding to deploy.")
          EOF

  # JOB 4: Trien khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval              # Chi chay khi job eval qua
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 2.11.7: Restart service mlops-serve tren VM.
            sudo systemctl restart mlops-serve
            
            # 2.11.8: Cho server san sang (sleep 5 giay) roi goi curl /health de xac nhan.
            echo "Waiting for server to start..."
            sleep 5
            curl -f http://localhost:8000/health || (echo "Health check failed!" && exit 1)
            echo -e "\n✅ Deployment successful and server is healthy!"
