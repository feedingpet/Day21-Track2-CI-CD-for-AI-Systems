name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chay unit tests tren du lieu ao (khong can GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # 2.11.1: Chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v

  # JOB 2: Huan luyen mo hinh tren du lieu thuc, upload artifact len cloud storage
  train:
    name: Train
    needs: test              # Chi chay khi job test qua
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      prev_accuracy: ${{ steps.read_metrics.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Download previous metrics (Bonus 4)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage
          
          try:
              bucket_name = '${{ secrets.CLOUD_BUCKET }}'
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob('models/latest/metrics.json')
              blob.download_to_filename('outputs/previous_metrics.json')
              print("✅ Downloaded previous metrics.")
          except Exception as e:
              print(f"⚠️ Could not download previous metrics: {e}")
          EOF

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.MLFLOW_TRACKING_USERNAME }}/${{ github.event.repository.name }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          acc=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$acc" >> $GITHUB_OUTPUT
          
          if [ -f "outputs/previous_metrics.json" ]; then
            prev_acc=$(python -c "import json; print(json.load(open('outputs/previous_metrics.json'))['accuracy'])")
          else
            prev_acc=0
          fi
          echo "prev_accuracy=$prev_acc" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage (Bonus 4)
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage
          
          bucket_name = '${{ secrets.CLOUD_BUCKET }}'
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          
          # Upload model
          blob_model = bucket.blob('models/latest/model.pkl')
          blob_model.upload_from_filename('models/model.pkl')
          
          # Upload metrics
          blob_metrics = bucket.blob('models/latest/metrics.json')
          blob_metrics.upload_from_filename('outputs/metrics.json')
          
          print("✅ Uploaded model and metrics to Cloud Storage.")
          EOF

      - name: Save reports as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: |
            outputs/metrics.json
            outputs/report.txt

  # JOB 3: Kiem tra chat luong - chi cho phep deploy khi accuracy >= 0.70 VA >= accuracy cu (Bonus 4)
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import sys
          acc = float("${{ needs.train.outputs.accuracy }}")
          prev_acc = float("${{ needs.train.outputs.prev_accuracy }}")
          threshold = 0.60
          
          print(f"New Accuracy: {acc:.4f}")
          print(f"Previous Accuracy: {prev_acc:.4f}")
          
          if acc < threshold:
              print(f"❌ Accuracy {acc:.4f} is below threshold {threshold}. Aborting.")
              sys.exit(1)
          
          if acc < prev_acc:
              print(f"❌ Accuracy {acc:.4f} is lower than previous {prev_acc:.4f}. Rollback/Abort deploy.")
              sys.exit(1)
              
          print(f"✅ Accuracy meets all criteria. Proceeding to deploy.")
          EOF


  # JOB 4: Trien khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval              # Chi chay khi job eval qua
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 2.11.7: Restart service mlops-serve tren VM.
            sudo systemctl restart mlops-serve
            
            # 2.11.8: Cho server san sang (sleep 5 giay) roi goi curl /health de xac nhan.
            echo "Waiting for server to start..."
            sleep 5
            curl -f http://localhost:8000/health || (echo "Health check failed!" && exit 1)
            echo -e "\n✅ Deployment successful and server is healthy!"
